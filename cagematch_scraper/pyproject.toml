[project]
name = "cagematch-scraper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Cursor Agent", email = "cursoragent@cursor.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.13.5",
    "lxml>=6.0.1",
    "pandas>=2.3.2",
    "requests>=2.32.5",
    "tqdm>=4.67.1",
    "typer>=0.17.3",
]

[project.scripts]
cagematch-scraper = "cagematch_scraper:main"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"
